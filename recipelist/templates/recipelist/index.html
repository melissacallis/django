{% extends 'recipelist/layout.html' %}

{% block title %}Recipe Search{% endblock %}

{% block content %}
  <div class="card p-4">
    <h1>Search for a Recipe</h1>
    <p class="text-muted">Search by dish name to pull its ingredients and directions.</p>
    <form action="{% url 'recipelist:search' %}" method="get">
      <div class="mb-3">
        <label for="q" class="form-label">Recipe name</label>
        <input type="search" class="form-control" id="q" name="q" placeholder="e.g. chicken curry" required>
      </div>
      <button type="submit" class="btn btn-primary">Search</button>
    </form>
  </div>
{% endblock %}
